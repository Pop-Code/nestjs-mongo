name: Test

on:
    # Trigger the workflow on push to master, and on every pull request (stacked pull requests included)
    push:
        branches:
            - master
    pull_request:

jobs:
    smoke:
        # Node 22 is supported at runtime (>=22.12, require(esm)), but Jest can only
        # load the ESM-only NestJS 12 packages on Node >= 24.9, so Node 22 runs the smoke test only.
        name: Smoke (Node 22.x)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 22.x
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x
                  cache: yarn
            - name: Install
              run: yarn install --frozen-lockfile
            - name: Lint
              run: yarn run lint
            - name: Build
              run: yarn run build
            - name: Smoke test (built package)
              run: yarn run test:smoke

    test:
        name: Test (Node ${{ matrix.node-version }}, MongoDB ${{ matrix.mongodb-version }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                node-version: [24.x, 26.x]
                # The mongodb v7 driver supports MongoDB server 4.4 to 9.0
                mongodb-version: ['6.0', '7.0', '8.0']

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: yarn
            - name: Start MongoDB (replica set, required for transactions and change streams)
              uses: supercharge/mongodb-github-action@1.12.1
              with:
                  mongodb-version: ${{ matrix.mongodb-version }}
                  mongodb-replica-set: test-rs
            - name: Install
              run: yarn install --frozen-lockfile
            - name: Lint
              run: yarn run lint
            - name: Build
              run: yarn run build
            - name: Smoke test (built package)
              run: yarn run test:smoke
            - name: Test
              run: yarn run test:cov
            - name: Codecov
              if: ${{ matrix.node-version == '24.x' && matrix.mongodb-version == '8.0' }}
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/coverage-final.json
                  fail_ci_if_error: true
